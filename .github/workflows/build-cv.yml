name: Build CV PDF
# Rebuilds assets/pdf/academic-cv.pdf whenever the LaTeX source changes, so
# the PDF never depends on any one machine's TeX installation. The committed
# PDF only (not cv-src) is pushed back, which cannot retrigger this workflow.
on:
  push:
    branches:
      - main
    paths:
      - "assets/cv-src/**"
  workflow_dispatch:
permissions:
  contents: write
  actions: write
jobs:
  build:
    name: XeLaTeX
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Compile main.tex
        uses: xu-cheng/latex-action@v3
        with:
          root_file: main.tex
          working_directory: assets/cv-src
          latexmk_use_xelatex: true
      - name: Install the built PDF
        run: mv assets/cv-src/main.pdf assets/pdf/academic-cv.pdf
      - name: Commit and push if changed
        id: push
        run: |
          git config user.name "${{ github.actor }}"
          git config user.email "${{ github.actor }}@users.noreply.github.com"
          git add assets/pdf/academic-cv.pdf
          if git diff --cached --quiet; then
            echo "changed=false" >> "$GITHUB_OUTPUT"
          else
            git commit -m "chore: rebuild CV PDF from cv-src"
            git pull --rebase origin main
            git push
            echo "changed=true" >> "$GITHUB_OUTPUT"
          fi
      # Pushes made with GITHUB_TOKEN never trigger other workflows, so the
      # PDF commit above cannot start a deploy by itself; dispatch is exempt.
      - name: Deploy the rebuilt CV
        if: steps.push.outputs.changed == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh workflow run deploy.yml --repo "${{ github.repository }}" --ref main
